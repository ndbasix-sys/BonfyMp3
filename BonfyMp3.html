effects.addEventListener('keydown',e=>{let th=e.target.closest('.hthumb');if(!th)return;let sl=th.parentElement,i=+sl.dataset.fx,v=+sl.dataset.value;if(e.key==='ArrowRight'){e.preventDefault();setFxValue(i,v+1,true)}if(e.key==='ArrowLeft'){e.preventDefault();setFxValue(i,v-1,true)}});
document.querySelector('#eq').onclick=()=>{eqpage.classList.add('open');ensureAudioGraph();audioCtx.resume()};backeq.onclick=()=>eqpage.classList.remove('open');eqon.onclick=()=>{ensureAudioGraph();eqEnabled=!eqEnabled;eqon.textContent=eqEnabled?'EQ ON':'EQ OFF';eqon.classList.toggle('on',eqEnabled);document.querySelectorAll('.vslide').forEach(s=>{let i=+s.dataset.i;filters[i].gain.value=eqEnabled?+s.dataset.value:0})};eqreset.onclick=()=>{document.querySelectorAll('.vslide').forEach((s,i)=>setBandValue(i,0,true))};limiterBtn.onclick=()=>{ensureAudioGraph();let on=limiterBtn.classList.toggle('on');limiterBtn.textContent=on?'🛡 LIMITER ON':'🛡 LIMITER OFF';compressor.threshold.value=on?-2:0;compressor.ratio.value=on?12:1};document.querySelector('#eqpreset').onclick=()=>alert('PRESET: nella prossima modifica inseriremo salvataggio e richiamo dei preset personali.');

let v=localStorage.getItem('bonfy_vol');if(v!==null){volume.value=v;a.volume=v;voltxt.textContent=Math.round(v*100)+'%'}let old=localStorage.getItem('bonfy_name');if(old){title.textContent=old.replace(/\.[^.]+$/,'');artist.textContent='Ultimo brano ascoltato • riselezionalo per riaprirlo';}
async function estimateBPM(f){try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const buf=await f.arrayBuffer();const audio=await ctx.decodeAudioData(buf);let data=audio.getChannelData(0),sr=audio.sampleRate,start=Math.min(data.length,Math.floor(sr*20)),end=Math.min(data.length,start+Math.floor(sr*45));if(end-start<sr*8){start=0;end=data.length}let hop=1024,env=[];for(let i=start;i+hop<end;i+=hop){let e=0;for(let j=i;j<i+hop;j++)e+=Math.abs(data[j]);env.push(e/hop)}let mean=env.reduce((x,y)=>x+y,0)/env.length;env=env.map(x=>Math.max(0,x-mean));let rate=sr/hop,best=0,bscore=-1;for(let B=60;B<=190;B++){let lag=Math.round(rate*60/B),s=0;for(let i=lag;i<env.length;i++)s+=env[i]*env[i-lag];if(s>bscore){bscore=s;best=B}}bpm.textContent=best||'--';localStorage.setItem('bonfy_bpm',best);ctx.close()}catch(e){bpm.textContent='--'}}
</script></body></html>
